name: "Test"

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pillow requests
      - name: Run unit tests
        working-directory: homeassistant-samsung-frametv-artchanger
        run: python -m unittest discover -s tests -v

  build:
    name: Test build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test build
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./homeassistant-samsung-frametv-artchanger
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-hass-frametv-artchanger
          image-tags: test
          push: "false"
          cosign: "false"
          version: test
