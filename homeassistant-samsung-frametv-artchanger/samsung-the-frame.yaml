# Home Assistant package for the "Samsung The Frame - Art Changer" app.
#
# Include it in configuration.yaml:
#
#   homeassistant:
#     packages:
#       samsung_the_frame: !include samsung-the-frame.yaml
#
# The app slug below assumes the app was installed from
# https://github.com/oliverwehrens/homeassistant-samsung-the-frame-art-changer
# (prefix 9c41c859). If you installed it from another repository, copy the slug
# from the URL of the app page (/hassio/addon/<slug>) and replace it below.

input_select:
  samsung_frame_color:
    name: Frame Color
    icon: mdi:palette
    options:
      - Any
      - Blue
      - Green
      - Red
      - Orange
      - Yellow
      - Purple
      - Pink
      - Teal
      - Gray

  samsung_frame_museum:
    name: Frame Museum
    icon: mdi:bank
    options:
      - Any
      - MoMA
      - Musée d'Orsay
      - Van Gogh Museum
      - Metropolitan Museum
      - Rijksmuseum
      - National Gallery London
      - Tate Britain

  samsung_frame_style:
    name: Frame Style
    icon: mdi:brush
    options:
      - Any
      - Modern Art
      - Contemporary Art
      - Impressionism
      - Post-Impressionism
      - Expressionism
      - Abstract Expressionism
      - Surrealism
      - Pop Art
      - Renaissance
      - Baroque
      - Romanticism
      - Realism

script:
  samsung_frame_new_art:
    alias: Samsung Frame new artwork
    icon: mdi:image-refresh
    mode: single
    sequence:
      - action: hassio.addon_start
        data:
          addon: 9c41c859_hass-frametv-artchanger

automation:
  - id: samsung_frame_daily_art
    alias: Samsung Frame daily artwork
    mode: single
    triggers:
      - trigger: time
        at: "23:00:00"
    actions:
      - action: script.samsung_frame_new_art
